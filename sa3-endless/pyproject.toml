[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa3-endless"
version = "0.1.0"
description = "Endless sound continuation from short samples with Stable Audio 3, for installations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
osc = ["python-osc>=1.8"]
sa3 = [
    "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3",
]
dev = ["pytest>=8"]

[project.scripts]
sa3-endless = "sa3_endless.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
